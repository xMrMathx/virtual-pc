<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortz VS — Full App</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000}
  body{overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  /* The full Shortz VS app, unmodified, filling the glass edge to
     edge — but ONLY after his OPEN tap (below). The engine sizes
     this layer from the host screen's shape: on the left vertical
     the layout viewport is phone-width, so the app renders its own
     phone UI — bottom tabs, swipeable card rows, tap a card -> its
     info -> its player — exactly as on a phone. */
  #app{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#000}
  body.live #app{display:block}
  /* THE READY SCREEN (his design 2026-11-02 ~06:58 CST): the
     wrapper is the gate. Until he taps OPEN this is all that
     exists of the Full App — its own start screen, no frame src,
     no network load of the real site, no media, no sound. The tap
     is the only door that ever loads the app; its own intro then
     plays and lands him inside, exactly like opening Shortz on
     his phone. Displacement (covered, stowed, powered off) and
     every boot return here — OPEN again to start. */
  #ready{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;
        align-items:center;justify-content:center;text-align:center;padding:22px;
        background:radial-gradient(120% 90% at 50% 0%,#1b0b26 0%,#07070d 60%);color:#9a9aad}
  body.live #ready{display:none}
  #ready .big{font-size:30px;font-weight:900;color:#f2f2f7;letter-spacing:.6px;line-height:1.05}
  #ready .big b{color:#ff2e88}
  #ready .sub{font-size:13px;font-weight:700;letter-spacing:2.2px;color:#c9c9d6}
  #ready .hint{font-size:13px;line-height:1.55;max-width:290px}
  #open{margin-top:8px;min-width:190px;min-height:64px;padding:16px 34px;
        font-size:21px;font-weight:900;letter-spacing:2.5px;color:#fff;
        background:#ff2e88;border:0;border-radius:16px;cursor:pointer;
        box-shadow:0 6px 24px rgba(255,46,136,.45)}
  #open:active{transform:scale(.97)}
</style>
</head>
<body class="ready">
<iframe id="app" title="Shortz VS — Full App"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen></iframe>
<div id="ready">
  <div class="big">SHORTZ <b>VS</b></div>
  <div class="sub">SHORTZ VS — FULL APP</div>
  <button id="open" type="button">OPEN</button>
  <div class="hint">Tap OPEN to start. The app loads only when you say so — nothing plays on its own.</div>
</div>

<script>
(function(){
  'use strict';
  /* The REAL Shortz VS app — the live site itself, unmodified and
     un-reskinned. Framing verified 2026-11-01: the GitHub Pages
     deployment sends no X-Frame-Options and no CSP frame-ancestors,
     so the exact app can live in this glass. (The Cloudflare Pages
     mirror frames cleanly too; this is the canonical share URL.) */
  var APP_URL = 'https://xmrmathx.github.io/shortz-tv/';
  var KEY = 'shortzapp';
  var frame = document.getElementById('app');
  var live = false;        /* the app document is loaded in the frame */

  function loadApp(){
    if (live) return;
    try { frame.src = APP_URL; } catch (e) {}
    live = true;
    document.body.classList.add('live');
    document.body.classList.remove('ready');
  }
  /* Back to the ready screen: the frame is UNLOADED to about:blank,
     which destroys the app's document — every video, every sound,
     gone — and the gate takes its place. Starting again is his
     OPEN tap, never an automatic reload. */
  function unloadToReady(){
    if (live){
      try { frame.src = 'about:blank'; } catch (e) {}
      live = false;
    }
    document.body.classList.remove('live');
    document.body.classList.add('ready');
  }

  /* THE ONLY DOOR (his design 2026-11-02 ~06:58 CST): a real,
     deliberate tap on this face's OPEN button loads the real site.
     Its own intro then plays and lands him in the app — that intro
     belongs inside this gate, after his tap. No boot path, no
     restore, no placement, no timer ever calls loadApp(). */
  document.getElementById('open').addEventListener('click', loadApp);

  /* DISPLACEMENT -> READY (his rules: a surface taken off its
     screen stops, audio included, until HE puts it back — and for
     this app, putting it back shows the ready screen; OPEN starts
     it again. Face-up moves — a swap, switch or split that keeps
     it the visible face of a powered, deployed screen — keep a
     running app running: the placement truth below never loses
     the face during such a move). The truth is the engine's
     layout snapshot in localStorage (vpc_layout_v1) — the same
     record the room's displacement guard reads. Face-up = this
     app has a host screen that is powered AND deployed (a mount
     host must be DOWN — a placement waiting under a stowed mount
     is not a face), AND no other app shares that host (one face
     per screen). A split guest spot counts as face-up. */
  function readSnap(){
    try {
      var s = JSON.parse(localStorage.getItem('vpc_layout_v1') || 'null');
      return (s && typeof s === 'object') ? s : null;
    } catch (e) { return null; }
  }
  function faceUp(s){
    if (!s) return false;
    var host = '';
    var sp = s.split_app && s.split_app[KEY];
    if (sp && sp.host) host = String(sp.host);
    else if (s.hosts && Object.prototype.hasOwnProperty.call(s.hosts, KEY))
      host = String(s.hosts[KEY] || '');
    else if (!sp)
      return true;   /* no snapshot names this app yet — the engine's
                        coded start position (left vertical) governs */
    if (!host) return false;
    if (s.power && s.power[host] === false) return false;
    if ((host === 'mount_left' || host === 'mount_right') && s.mounts &&
        (s.mounts[host] === 0 || s.mounts[host] === false)) return false;
    if (!sp){
      var others = ['browser','youtube','muse','gaming','babyboo','studio'];
      for (var i = 0; i < others.length; i++){
        var k = others[i], kh = '';
        var ksp = s.split_app && s.split_app[k];
        if (ksp && ksp.host) kh = String(ksp.host);
        else if (s.hosts && Object.prototype.hasOwnProperty.call(s.hosts, k))
          kh = String(s.hosts[k] || '');
        if (kh && kh === host) return false;   /* another app holds this screen's face */
      }
    }
    return true;
  }
  function applyGate(){
    if (!live) return;
    var snap = readSnap();
    if (snap && !faceUp(snap)) unloadToReady();
  }
  setInterval(applyGate, 300);

  /* The room's displacement guard (tools.js) posts the same
     'displaced' message the YouTube surface obeys; here it is a
     prompt to re-check the placement truth immediately — the
     snapshot itself stays the single source, so a face-up move
     the guard momentarily reports during a swap can never reset
     an app whose face the snapshot says never left. */
  window.addEventListener('message', function(e){
    if (!e.data || e.data.vpc !== 'displaced') return;
    if (e.data.on) applyGate();
  });

  /* MASTER + PER-SCREEN VOLUME (hub contract): the top window's
     hub delivers THIS screen's effective gain (master x this
     screen's console slider) to this window — direct var,
     'vpc-mastervol' message, __vpcApplyMasterVol call. The app
     inside the frame is same-origin, so the gain is forwarded in:
     the var + message are relayed to the app window, every HTML
     media element in the app is set directly, and YouTube embeds
     inside the app receive the API setVolume command. Media the
     app starts later is caught by the re-sweep and by the hub's
     own re-pushes. */
  var gain = 1;
  function ytCmd(win, func, args){
    try { win.postMessage({ event: 'command', func: func, args: args || [] }, '*'); } catch (e) {}
  }
  function eachEmbed(doc, fn){
    var fr = doc.querySelectorAll('iframe');
    for (var j = 0; j < fr.length; j++){
      var src = '';
      try { src = fr[j].getAttribute('src') || ''; } catch (e) {}
      if (/youtube(-nocookie)?\.com\/embed/.test(src) && fr[j].contentWindow) fn(fr[j].contentWindow);
    }
  }
  function sweepAppMedia(){
    var doc = null;
    try { doc = frame.contentDocument; } catch (e) { return; }
    if (!doc) return;
    try {
      var ms = doc.querySelectorAll('video, audio');
      for (var i = 0; i < ms.length; i++){ try { ms[i].volume = gain; } catch (e) {} }
      eachEmbed(doc, function (w){ ytCmd(w, 'setVolume', [Math.round(gain * 100)]); });
    } catch (e) {}
  }
  function applyGain(){
    var v = (typeof window.__vpcMasterVol === 'number') ? window.__vpcMasterVol : gain;
    gain = Math.max(0, Math.min(1, v));
    try { frame.contentWindow.__vpcMasterVol = gain; } catch (e) {}
    try { frame.contentWindow.postMessage({ type: 'vpc-mastervol', vol: gain, muted: gain === 0 }, '*'); } catch (e) {}
    sweepAppMedia();
  }
  window.__vpcApplyMasterVol = applyGain;
  window.addEventListener('message', function (e){
    if (e.data && e.data.type === 'vpc-mastervol'){ window.__vpcMasterVol = e.data.vol; applyGain(); }
  });
  setInterval(function (){ if (live) sweepAppMedia(); }, 2000);
  frame.addEventListener('load', function (){ setTimeout(applyGain, 350); });

  /* proof / diagnostics surface, same style as the other screens */
  window.__vpcShortzAppState = function(){
    var snap = readSnap();
    return { live: live, ready: !live,
             src: frame.getAttribute('src') || '',
             face: snap ? faceUp(snap) : null };
  };
})();
</script>
</body>
</html>
