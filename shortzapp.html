<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortz VS — Full App</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000}
  body{overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  /* The full Shortz VS app, unmodified, filling the glass edge to
     edge. The engine sizes this layer from the host screen's shape:
     on the left vertical the layout viewport is phone-width, so the
     app renders its own phone UI — bottom tabs, swipeable card rows,
     tap a card -> its info -> its player — exactly as on a phone. */
  #app{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
  /* Shown only while displaced: the app is UNLOADED (below), so this
     veil is all that exists of it — no hidden picture, no hidden
     sound. Putting it back on a screen reloads the app fresh. */
  #veil{position:absolute;inset:0;display:none;flex-direction:column;gap:8px;
        align-items:center;justify-content:center;text-align:center;padding:18px;
        background:#07070d;color:#9a9aad}
  #veil .big{font-size:19px;font-weight:800;color:#f2f2f7;letter-spacing:.4px}
  #veil .big b{color:#ff2e88}
  #veil .sub{font-size:13px;line-height:1.5;max-width:300px}
  body.stopped #veil{display:flex}
  body.stopped #app{display:none}
</style>
</head>
<body>
<iframe id="app" title="Shortz VS — Full App"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen></iframe>
<div id="veil">
  <div class="big">SHORTZ <b>VS</b> — FULL APP</div>
  <div class="sub">Stopped — it's off its screen. Put it back on a screen and it picks right back up.</div>
</div>

<script>
(function(){
  'use strict';
  /* The REAL Shortz VS app — the live site itself, unmodified and
     un-reskinned. Framing verified 2026-11-01: the GitHub Pages
     deployment sends no X-Frame-Options and no CSP frame-ancestors,
     so the exact app can live in this glass. (The Cloudflare Pages
     mirror frames cleanly too; this is the canonical share URL.) */
  var APP_URL = 'https://xmrmathx.github.io/shortz-tv/';
  var KEY = 'shortzapp';
  var frame = document.getElementById('app');
  var live = false;        /* the app document is loaded in the frame */
  var stopped = false;     /* displaced: frame unloaded, audio dead */

  function loadApp(){
    try { frame.src = APP_URL; } catch (e) {}
    live = true;
  }
  /* DISPLACEMENT STOP (his ruling 2026-11-01 ~20:36 CST — a surface
     taken off its screen stops, audio included, until HE puts it
     back). The app is cross-origin, so nothing can reach inside it
     to pause its player; the stop here is the hard one the rule
     demands: the frame is UNLOADED to about:blank, which destroys
     the app's document — every video, every sound, gone — and the
     veil takes its place. Coming back reloads the app at its front
     door (the app keeps its own place-keeping internally, like any
     fresh open of Shortz on a phone). */
  /* Two stop signals, one rule: EITHER signal saying "down" stops
     the app; BOTH must say "up" before it returns. (A resume from
     one signal must never override the other's stop.) */
  var msgStop = false, snapStop = false;
  function applyStop(){
    var s = msgStop || snapStop;
    if (s && !stopped){
      stopped = true;
      try { frame.src = 'about:blank'; } catch (e) {}
      live = false;
      document.body.classList.add('stopped');
    } else if (!s && stopped){
      stopped = false;
      document.body.classList.remove('stopped');
      loadApp();
    }
  }
  function stopApp(){ msgStop = true; applyStop(); }
  function resumeApp(){ msgStop = false; applyStop(); }

  /* Signal 1 — the room's displacement guard (tools.js) tells every
     tracked surface when it leaves its screen, the same message the
     YouTube surface obeys. */
  window.addEventListener('message', function(e){
    if (!e.data || e.data.vpc !== 'displaced') return;
    if (e.data.on) stopApp(); else resumeApp();
  });

  /* Signal 2 — this surface's own watch on the same placement truth
     the guard reads: the engine's layout snapshot in localStorage
     (vpc_layout_v1). Face-up = this app has a host screen that is
     powered, AND no other app shares that host (the engine's yield
     rule: one face per screen — when he switches another app onto
     this screen, this app steps aside, stopped; when that app
     leaves, this app's face returns on its own). A split guest spot
     counts as face-up. No snapshot yet (first boot) = face-up. */
  function faceUp(){
    var s = null;
    try { s = JSON.parse(localStorage.getItem('vpc_layout_v1') || 'null'); }
    catch (e) { return !stopped; }
    if (!s || typeof s !== 'object') return true;
    var host = '';
    var sp = s.split_app && s.split_app[KEY];
    if (sp && sp.host) host = String(sp.host);
    else if (s.hosts && Object.prototype.hasOwnProperty.call(s.hosts, KEY))
      host = String(s.hosts[KEY] || '');
    else if (!sp)
      return true;   /* no snapshot names this app yet — the engine's
                        coded start position (left vertical) governs */
    if (!host) return false;
    if (s.power && s.power[host] === false) return false;
    if (!sp){
      var others = ['browser','youtube','muse','gaming','babyboo','studio'];
      for (var i = 0; i < others.length; i++){
        var k = others[i], kh = '';
        var ksp = s.split_app && s.split_app[k];
        if (ksp && ksp.host) kh = String(ksp.host);
        else if (s.hosts && Object.prototype.hasOwnProperty.call(s.hosts, k))
          kh = String(s.hosts[k] || '');
        if (kh && kh === host) return false;   /* another app holds this screen's face */
      }
    }
    return true;
  }
  setInterval(function(){
    snapStop = !faceUp();
    applyStop();
  }, 500);

  /* MASTER + PER-SCREEN VOLUME (hub contract): the top window's
     hub delivers THIS screen's effective gain (master x this
     screen's console slider) to this window — direct var,
     'vpc-mastervol' message, __vpcApplyMasterVol call. Until now
     all three landed here and DIED: this wrapper had no applier,
     so the Full App's volume slider (and the master) did nothing
     at all — his "the volume buttons don't work" report. The app
     inside the frame is same-origin, so the gain is forwarded in:
     the var + message are relayed to the app window, every HTML
     media element in the app is set directly, and YouTube embeds
     inside the app receive the API setVolume command. Media the
     app starts later is caught by the re-sweep and by the hub's
     own re-pushes. */
  var gain = 1;
  function ytCmd(win, func, args){
    try { win.postMessage({ event: 'command', func: func, args: args || [] }, '*'); } catch (e) {}
  }
  function eachEmbed(doc, fn){
    var fr = doc.querySelectorAll('iframe');
    for (var j = 0; j < fr.length; j++){
      var src = '';
      try { src = fr[j].getAttribute('src') || ''; } catch (e) {}
      if (/youtube(-nocookie)?\.com\/embed/.test(src) && fr[j].contentWindow) fn(fr[j].contentWindow);
    }
  }
  function sweepAppMedia(){
    var doc = null;
    try { doc = frame.contentDocument; } catch (e) { return; }
    if (!doc) return;
    try {
      var ms = doc.querySelectorAll('video, audio');
      for (var i = 0; i < ms.length; i++){ try { ms[i].volume = gain; } catch (e) {} }
      eachEmbed(doc, function (w){ ytCmd(w, 'setVolume', [Math.round(gain * 100)]); });
    } catch (e) {}
  }
  function applyGain(){
    var v = (typeof window.__vpcMasterVol === 'number') ? window.__vpcMasterVol : gain;
    gain = Math.max(0, Math.min(1, v));
    try { frame.contentWindow.__vpcMasterVol = gain; } catch (e) {}
    try { frame.contentWindow.postMessage({ type: 'vpc-mastervol', vol: gain, muted: gain === 0 }, '*'); } catch (e) {}
    sweepAppMedia();
  }
  window.__vpcApplyMasterVol = applyGain;
  window.addEventListener('message', function (e){
    if (e.data && e.data.type === 'vpc-mastervol'){ window.__vpcMasterVol = e.data.vol; applyGain(); }
  });
  setInterval(function (){ if (!stopped && live) sweepAppMedia(); }, 2000);

  /* BOOT CUE (his rule — nothing plays unasked): this wrapper
     (re)loads the app at its front door on boot and on return
     from displacement. If the app's own open starts any media by
     itself, that media is paused ONCE here — unless he has
     already touched the app since it loaded (his taps are his,
     and anything he starts is left alone). */
  var appTouched = false;
  function cuePauseApp(){
    if (appTouched || stopped) return;
    var doc = null;
    try { doc = frame.contentDocument; } catch (e) { return; }
    if (!doc) return;
    try {
      var ms = doc.querySelectorAll('video, audio');
      for (var i = 0; i < ms.length; i++){ try { ms[i].pause(); } catch (e) {} }
      eachEmbed(doc, function (w){ ytCmd(w, 'pauseVideo', []); });
    } catch (e) {}
  }
  frame.addEventListener('load', function (){
    appTouched = false;
    try {
      var doc = frame.contentDocument;
      if (doc) doc.addEventListener('pointerdown', function (){ appTouched = true; }, true);
    } catch (e) {}
    setTimeout(applyGain, 350);
    setTimeout(cuePauseApp, 900);
  });

  /* proof / diagnostics surface, same style as the other screens */
  window.__vpcShortzAppState = function(){
    return { live: live, stopped: stopped,
             src: frame.getAttribute('src') || '',
             face: faceUp() };
  };

  loadApp();
})();
</script>
</body>
</html>
