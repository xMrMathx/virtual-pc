<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALLON — Live Talk · Screen 8</title>
<style>
  :root{--bg:#06060a;--panel:#12121c;--line:#26263a;--ink:#f2f2f7;--mut:#9a9aad;--gold:#ffb800;--cyan:#00f0ff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(120% 100% at 50% 0%, #101020 0%, var(--bg) 72%);color:var(--ink);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  #stage{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
         padding:5.5% 6% 2%;overflow-y:auto}

  /* ---- presence: the call-screen look (his spec, 04:42) ---- */
  #presence{display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
  #ring{position:relative;width:37vmin;height:37vmin;max-width:290px;max-height:290px;border-radius:50%;
        padding:1.6vmin;transition:transform .35s ease}
  #ring::before{content:'';position:absolute;inset:0;border-radius:50%;
        border:2.5px solid rgba(255,184,0,.35)}
  #ring::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none}
  #face{width:100%;height:100%;border-radius:50%;object-fit:contain;padding:4.5%;display:block;
        background:radial-gradient(circle at 50% 42%, #141422 0%, #0a0a12 78%)}
  /* idle: quiet gold halo */
  #presence[data-state="idle"] #ring{box-shadow:0 0 34px rgba(255,184,0,.22)}
  /* listening: cyan breathe */
  #presence[data-state="listening"] #ring{animation:breathe 2.2s ease-in-out infinite}
  #presence[data-state="listening"] #ring::before{border-color:rgba(0,240,255,.85)}
  #presence[data-state="listening"] #ring::after{box-shadow:0 0 46px rgba(0,240,255,.4), inset 0 0 26px rgba(0,240,255,.14)}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.022)}}
  /* thinking: gold ring runs */
  #presence[data-state="thinking"] #ring::before{border-color:rgba(255,184,0,.25);
        border-top-color:var(--gold);border-right-color:var(--gold);animation:spin 1.1s linear infinite}
  #presence[data-state="thinking"] #ring{box-shadow:0 0 40px rgba(255,184,0,.3)}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* speaking: warm pulse, like a voice */
  #presence[data-state="speaking"] #ring{animation:voicepulse .85s ease-in-out infinite}
  #presence[data-state="speaking"] #ring::before{border-color:rgba(255,184,0,.9)}
  #presence[data-state="speaking"] #ring::after{box-shadow:0 0 52px rgba(255,184,0,.45), inset 0 0 22px rgba(0,240,255,.12)}
  @keyframes voicepulse{0%,100%{transform:scale(1)}50%{transform:scale(1.032)}}
  /* unavailable: dim, honest */
  #presence[data-state="unavailable"] #ring{box-shadow:0 0 18px rgba(255,83,64,.25)}
  #presence[data-state="unavailable"] #ring::before{border-color:rgba(255,83,64,.5)}
  #pill{margin-top:-3.4vmin;position:relative;z-index:2;background:#fff;color:#0a0a10;border-radius:999px;
        padding:1.1vmin 4.6vmin;font-size:4.1vmin;font-weight:800;letter-spacing:.4px;
        box-shadow:0 6px 22px rgba(0,0,0,.5)}
  #status{margin-top:2.6vmin;color:var(--mut);font-size:3.3vmin;text-align:center;letter-spacing:.6px;min-height:1.4em}
  #status b{color:var(--cyan);font-weight:800}
  #status .gold{color:var(--gold)}

  /* ---- conversation thread ---- */
  #thread{width:94%;max-width:560px;margin-top:2.2vmin;display:none;flex-direction:column;gap:8px}
  #thread.show{display:flex}
  #heard{align-self:flex-end;max-width:88%;background:#1b2a33;border:1.5px solid rgba(0,240,255,.35);
         border-radius:13px;padding:9px 13px;font-size:3.6vmin;line-height:1.4;color:#cfeffb}
  #heard .who{color:var(--cyan);font-weight:800;font-size:2.9vmin;letter-spacing:1px;display:block;margin-bottom:2px}
  #heard.live{opacity:.75;font-style:italic}
  #reply{align-self:flex-start;max-width:92%;background:var(--panel);border:1.5px solid rgba(255,184,0,.45);
         border-radius:13px;padding:10px 14px;font-size:3.8vmin;line-height:1.45;color:#fff3d6}
  #reply .who{color:var(--gold);font-weight:800;font-size:2.9vmin;letter-spacing:1px;display:block;margin-bottom:2px}

  /* ---- the one control: the call button ---- */
  #session{display:flex;padding:12px 12px 4px;flex:0 0 auto;justify-content:center}
  .sbtn{border-radius:999px;border:1.5px solid var(--line);background:var(--panel);
        color:var(--ink);font-weight:900;letter-spacing:.6px;cursor:pointer}
  .sbtn:active{transform:scale(.97)}
  /* LIVE TALK starts the call; while the call runs this same button
     is the HANG UP. Nothing else competes with it. */
  #liveBtn{height:66px;min-width:min(320px,86%);padding:0 36px;background:var(--gold);border-color:var(--gold);
        color:#191002;font-size:19px;box-shadow:0 8px 30px rgba(255,184,0,.28)}
  #liveBtn.on{background:#ff5340;border-color:#ff5340;color:#fff;box-shadow:0 8px 30px rgba(255,83,64,.3)}

  /* the typed line: a quiet fallback for when the ear is down —
     visually minor by design */
  #bar{display:flex;gap:8px;padding:8px 12px 12px;flex:0 0 auto;align-items:center}
  #cmd{flex:1;height:40px;border-radius:10px;border:1.5px solid var(--line);background:rgba(18,18,28,.6);
       color:var(--ink);font-size:14px;padding:0 12px;outline:none;min-width:40px}
  #cmd:focus{border-color:var(--gold)}
  /* short glass (the mount is squarish): shrink the presence so the whole
     conversation fits above the controls — nothing ever paints over them */
  @media (max-height: 540px){
    #stage{padding-top:3%}
    #ring{width:29vmin;height:29vmin}
    #status{margin-top:1.4vmin}
    #thread{margin-top:1vmin}
  }
  #send{height:40px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);
        color:var(--mut);font-weight:800;font-size:13px;cursor:pointer;flex:0 0 auto}
</style>
</head>
<body>
<div id="stage">
  <div id="presence" data-state="idle">
    <div id="ring"><img id="face" src="allon-bust.png" alt="ALLON"></div>
    <div id="pill">ALLON</div>
  </div>
  <div id="status">ALLON runs this PC. <b>Tap LIVE TALK</b> — and just talk.</div>
  <div id="thread">
    <div id="heard" style="display:none"><span class="who">YOU</span><span id="heardTx"></span></div>
    <div id="reply" style="display:none"><span class="who">ALLON</span><span id="replyTx"></span></div>
  </div>
</div>
<div id="session">
  <button class="sbtn" id="liveBtn">● LIVE TALK</button>
</div>
<div id="bar">
  <input id="cmd" type="text" placeholder="or type…" autocomplete="off">
  <button id="send">SEND</button>
</div>

<script>
(function(){
  'use strict';
  /* ============================================================
     ALLON — Live Talk. Screen 8's resident is the PC's ONE AI:
     ALLON himself (his consolidation ruling, 2026-11-01). This
     screen is a CALL, nothing else: tap LIVE TALK, he greets you
     first, you talk, he answers out loud and runs the whole PC,
     and HANG UP ends the call. No second mode, no chips.
     EVERY utterance (voice or typed) goes to the PC's real command
     layer through the same channel the typed line has always used
     (window.top.__vpcMuseCmd -> the engine's _route_command + the
     intent layer — screen swaps, mounts, projector, power, LED,
     splits, tools, and the state/knowledge Q&A, incl. the office:
     who's on shift, today's projects, what's going on). Replies
     come back on window.top.__vpcMuseReply and are printed AND
     spoken here. There is no second router in this page; the one
     extra channel used is the system's own zoom request global
     (__vpcZoomReq), and only for "zoom <app>" orders the command
     layer itself declines.
     The ear is the APK's native speech bridge — tap-to-talk, NOT
     the wake-word spotter (window.AllonShell.startListening/speak;
     results arrive on window.top.__vpcMuseNativeSay), with the
     web SpeechRecognition/speechSynthesis pair behind it. If no
     ear can open, the glass SAYS so in plain words and the typed
     line takes the order — the button never sits dead.
     ============================================================ */
  var $ = function(id){ return document.getElementById(id); };
  var presence = $('presence'), statusEl = $('status'), thread = $('thread'),
      heardBox = $('heard'), heardTx = $('heardTx'),
      replyBox = $('reply'), replyTx = $('replyTx'),
      liveBtn = $('liveBtn'),
      cmd = $('cmd');

  var V = {
    srCtor: !!(window.SpeechRecognition || window.webkitSpeechRecognition),
    tts: !!window.speechSynthesis,
    bridge: 'none',           // 'full' | 'listapps-only' | 'none'
    mode: 'off',              // 'off' | 'live' — the call is the only mode
    state: 'idle',            // idle|listening|hearing|thinking|speaking|unavailable
    backend: 'none',          // 'native' | 'web' | 'none'
    lastError: '',
    log: [], spoken: [], turns: []
  };
  window.__vpcMuseVoice = V;
  function log(s){ V.log.push(s); if (V.log.length > 60) V.log.shift(); try { console.log('VPC MUSE: ' + s); } catch (e) {} }
  function topGet(k){ try { return window.top[k]; } catch (e) { return undefined; } }
  function topSet(k, v){ try { window.top[k] = v; } catch (e) {} }
  function shell(){
    var a = window.AllonShell || topGet('AllonShell');
    return (a && typeof a === 'object') ? a : null;
  }
  function bridgeKind(){
    var a = shell();
    if (!a) return 'none';
    if (typeof a.startListening === 'function' && typeof a.speak === 'function') return 'full';
    return 'listapps-only';
  }
  V.bridge = bridgeKind();

  /* ---------------- presence / status ---------------- */
  function setState(s, statusHtml){
    V.state = s;
    presence.setAttribute('data-state',
      s === 'listening' || s === 'hearing' ? 'listening' :
      s === 'thinking' ? 'thinking' :
      s === 'speaking' ? 'speaking' :
      s === 'unavailable' ? 'unavailable' : 'idle');
    if (statusHtml !== undefined) statusEl.innerHTML = statusHtml;
  }
  function showHeard(text, live){
    thread.classList.add('show');
    heardBox.style.display = 'block';
    heardBox.classList.toggle('live', !!live);
    heardTx.textContent = text;
  }
  function showReply(text){
    thread.classList.add('show');
    replyBox.style.display = 'block';
    replyTx.textContent = text;
  }

  /* ---------------- speech out (TTS) ---------------- */
  var speakDone = null;   // callback for the current utterance
  function speechText(display){
    var t = display;
    var m;
    if ((m = t.match(/^SCREENS (\d+) ⇄ (\d+)/))) return 'Done — screens ' + m[1] + ' and ' + m[2] + ' are switched.';
    if ((m = t.match(/^SCREEN (\d+) — (DOWN|UP)/))) return 'Done — screen ' + m[1] + ' is ' + (m[2] === 'DOWN' ? 'down.' : 'up.');
    if ((m = t.match(/^PLAYING ON THE PROJECTOR/))) return "Done — it's playing on the projector.";
    if ((m = t.match(/^PROJECTOR CLEARED/))) return 'Done — the projector is cleared.';
    if ((m = t.match(/^(.+?) — (ON|OFF) ✓?$/))) return m[1].charAt(0) + m[1].slice(1).toLowerCase() + ' is ' + m[2].toLowerCase() + '.';
    return t.replace(/✓/g, '').replace(/⇄/g, ' and ').replace(/\s—\s/g, ', ').replace(/\s+/g, ' ').trim();
  }
  function speak(displayText, after){
    var text = speechText(displayText);
    var a = shell();
    if (V.backend === 'native' && a && typeof a.speak === 'function'){
      V.spoken.push(text); log('tts:speak(native) ' + text);
      setState('speaking');
      speakDone = after || null;
      try { a.speak(text); } catch (e) { log('tts:native-error ' + e); finishSpeak(); }
      return;
    }
    if (V.tts){
      try { window.speechSynthesis.cancel(); } catch (e) {}
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 1.02;
      V.spoken.push(text); log('tts:speak ' + text);
      setState('speaking');
      speakDone = after || null;
      u.onend = function(){ finishSpeak(); };
      u.onerror = function(){ finishSpeak(); };
      try { window.speechSynthesis.speak(u); }
      catch (e) { log('tts:error ' + e); finishSpeak(); }
      return;
    }
    log('tts:unavailable — reply printed only');
    if (after) setTimeout(after, 350);
  }
  function finishSpeak(){
    var cb = speakDone; speakDone = null;
    if (cb) cb();
  }
  function stopSpeaking(how){
    var a = shell();
    if (V.backend === 'native' && a && typeof a.stopSpeaking === 'function'){
      try { a.stopSpeaking(); } catch (e) {}
    }
    if (V.tts){ try { window.speechSynthesis.cancel(); } catch (e) {} }
    if (speakDone){ log('tts:cancelled(' + how + ')'); speakDone = null; }
  }

  /* ---------------- the turn pipeline ----------------
     One door for every final transcript, however it arrived
     (web SR, native bridge, typed bar, test seam). */
  var awaiting = false, lastReplySeen = '';
  var END_PHRASES = ['stop', 'stop talking', "that's all", 'that is all', 'goodbye',
                     'bye', 'never mind', 'nevermind', 'hang up', 'end session', 'end the session'];
  function isEndPhrase(t){
    var c = t.toLowerCase().replace(/[.!?,]/g, '').trim();
    return END_PHRASES.indexOf(c) >= 0;
  }
  var ZOOMABLE = { youtube: 'youtube', muse: 'muse', shortz: 'shortz', office: 'hq', hq: 'hq', browser: 'browser' };
  function zoomFallback(text){
    var c = ' ' + text.toLowerCase() + ' ';
    if (!/ zoom /.test(c)) return false;
    if (/ zoom (out|back)/.test(c)){ topSet('__vpcZoomReq', '__exit'); return 'Zoomed back out.'; }
    for (var name in ZOOMABLE){
      if (c.indexOf(' ' + name) >= 0 || c.indexOf(name + ' ') >= 0){
        topSet('__vpcZoomReq', ZOOMABLE[name]);
        return 'Zoomed in on ' + name + '.';
      }
    }
    return false;
  }
  function onFinalTranscript(text, source){
    text = (text || '').trim();
    if (!text) return;
    log('heard(' + source + '): ' + text);
    if (V.mode !== 'off' && isEndPhrase(text)){ endSession(true); return; }
    showHeard(text, false);
    V.turns.push({ you: text });
    setState('thinking', '<span class="gold">Thinking…</span>');
    awaiting = true;
    /* clear the reply slot BEFORE sending, so even an identical
       repeat answer registers as a fresh write */
    lastReplySeen = '';
    topSet('__vpcMuseReply', '');
    topSet('__vpcMuseCmd', text);
    setTimeout(function(){
      if (awaiting){ awaiting = false; onReply("The PC didn't answer that one — try me again."); }
    }, 7000);
  }
  function onReply(text){
    awaiting = false;
    V.turns[V.turns.length - 1] && (V.turns[V.turns.length - 1].reply = text);
    showReply(text);
    if (V.mode === 'off'){ setState('idle'); return; }
    if (text.toLowerCase().indexOf("didn't catch") === 0){
      var z = zoomFallback(V.turns[V.turns.length - 1].you || '');
      if (z){
        showReply(z);
        speak(z, afterTurn);
        return;
      }
    }
    speak(text, afterTurn);
  }
  function afterTurn(){
    if (V.mode === 'live'){ setState('listening', '<b>Listening…</b> just talk — or tap HANG UP'); ensureListening(); }
  }
  /* the engine answers on the top page; consume new replies.
     Snapshot whatever is there at load so a stale answer from
     before a reload never replays as if it were fresh. */
  lastReplySeen = topGet('__vpcMuseReply') || '';
  setInterval(function(){
    var r = topGet('__vpcMuseReply') || '';
    if (r && r !== lastReplySeen){
      lastReplySeen = r;
      if (briefingCb){ var bf = briefingCb; briefingCb = null; bf(r); return; }
      if (awaiting) onReply(r);
      else if (V.mode !== 'off') onReply(r);
      else { showReply(r); }
    }
  }, 180);

  /* ---------------- web SpeechRecognition backend ---------------- */
  var sr = null, srRun = false, wantListen = false, srRetry = null;
  function makeSR(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    var r = new SR();
    r.continuous = true;   /* the call: always listening while it runs */
    r.interimResults = true;
    r.lang = 'en-US';
    r.onresult = function(e){
      var fin = '', inter = '';
      for (var i = e.resultIndex; i < e.results.length; i++){
        if (e.results[i].isFinal) fin += e.results[i][0].transcript;
        else inter += e.results[i][0].transcript;
      }
      if (inter) onInterim(inter);
      if (fin){ wantListen = false; onFinalTranscript(fin, 'web-sr'); }
    };
    r.onerror = function(e){
      var n = (e && e.error) || 'error';
      V.lastError = n; log('sr:error ' + n);
      if (n === 'not-allowed' || n === 'service-not-allowed'){
        voiceUnavailable('Mic blocked — allow the microphone for this app, or type below and I\'ll still answer.');
      } else if (n === 'network'){
        setState('unavailable', 'Speech service unreachable right now — type below, or try LIVE TALK again in a moment.');
        log('sr:network — recognition service unreachable in this shell');
      } else if (n === 'audio-capture'){
        voiceUnavailable('No microphone found on this device — type below and I\'ll still answer.');
      }
    };
    r.onend = function(){
      srRun = false;
      if (wantListen && V.mode !== 'off' && V.state !== 'speaking' && V.state !== 'thinking'){
        clearTimeout(srRetry);
        srRetry = setTimeout(ensureListening, 250);
      }
    };
    return r;
  }
  function ensureListening(){
    if (V.mode === 'off') return;
    if (V.backend === 'native'){
      var a = shell();
      if (a && typeof a.startListening === 'function'){
        try { a.startListening(); log('sr:native startListening'); } catch (e) { log('sr:native-error ' + e); }
      }
      return;
    }
    if (V.backend !== 'web') return;
    if (!sr) sr = makeSR();
    if (!sr || srRun) return;
    wantListen = true;
    try { sr.start(); srRun = true; log('sr:start (' + V.mode + ', continuous=' + sr.continuous + ')'); }
    catch (e) { /* already started */ }
  }
  function haltListening(){
    wantListen = false;
    clearTimeout(srRetry);
    if (sr && srRun){ try { sr.stop(); } catch (e) {} srRun = false; }
    var a = shell();
    if (a && typeof a.stopListening === 'function'){ try { a.stopListening(); } catch (e) {} }
  }
  function onInterim(text){
    if (V.mode === 'off') return;
    if (V.state === 'speaking'){
      /* BARGE-IN: he's talking over the answer — cut the voice,
         keep his words, take the turn when the final lands. */
      var words = text.trim().split(/\s+/).filter(Boolean);
      if (V.mode === 'live' && words.length >= 2){
        log('barge-in: "' + text + '"');
        stopSpeaking('barge-in');
        setState('hearing', '<b>Listening…</b>');
        showHeard(text, true);
      }
      return;
    }
    setState('hearing', '<b>Listening…</b>');
    showHeard(text, true);
  }

  /* ---------------- native bridge inbound ----------------
     The APK delivers recognition results + speech-done signals by
     setting window.top.__vpcMuseNativeSay to a JSON string
     {seq, type:'interim'|'final'|'error'|'speakdone', text}. */
  var nativeSeq = 0;
  setInterval(function(){
    if (V.backend !== 'native') return;
    var raw = topGet('__vpcMuseNativeSay') || '';
    if (!raw) return;
    var msg;
    try { msg = JSON.parse(raw); } catch (e) { return; }
    if (!msg || msg.seq === nativeSeq) return;
    nativeSeq = msg.seq;
    if (msg.type === 'interim') onInterim(msg.text || '');
    else if (msg.type === 'final'){ wantListen = false; onFinalTranscript(msg.text || '', 'native'); }
    else if (msg.type === 'speakdone') finishSpeak();
    else if (msg.type === 'error'){
      V.lastError = msg.text || 'unknown:0';
      log('sr:native error ' + V.lastError);
      onNativeEarError(V.lastError);
    }
  }, 200);

  /* ---------------- native ear errors (Defect 28) ----------------
     The bridge reports every ear failure as "word:code" — word from
     its error table, code the REAL Android SpeechRecognizer ERROR_*
     number (or 'pre' for its own mic-permission pre-check). A
     "recovering:" prefix means the bridge is already walking its
     recognition-service chain: the session stays ALIVE and the glass
     just says so. Only a bare word:code is fatal, and it always
     renders as plain words — never a raw "(recognizer-error)". */
  function onNativeEarError(text){
    text = String(text || '');
    if (text.indexOf('recovering:') === 0){
      log('sr:native recovering (' + text.slice('recovering:'.length) + ')');
      if (V.mode !== 'off') setState('listening', 'Reconnecting my ear… one second');
      return;
    }
    voiceUnavailable(plainEarError(text));
  }
  function plainEarError(text){
    var parts = String(text || '').split(':');
    var word = parts[0] || '', code = parts[1] || '';
    switch (word){
      case 'not-allowed-permanent':
        return 'Android won\'t ask again — turn the mic on here: Settings → Apps → Virtual PC → Permissions → Microphone → Allow, then tap LIVE TALK.';
      case 'not-allowed':
        return 'Microphone permission is off — allow the mic when Android asks, then tap LIVE TALK again. Typing works below, and I\'ll still answer.';
      case 'recognizer-busy':
        return 'The speech service is busy right now — give it a breath and tap LIVE TALK again, or type below.';
      case 'no-match':
        return 'I didn\'t catch any words that time — tap LIVE TALK and say it again, or type below.';
      case 'network': case 'network-timeout':
        return 'The speech service couldn\'t be reached just now — check the connection, or type below and I\'ll still answer.';
      case 'audio':
        return 'The microphone hit a problem — make sure nothing else is using it, then tap LIVE TALK again. Typing works below.';
      case 'server':
        return 'The phone\'s speech service answered with an error — type below and I\'ll still answer, or try LIVE TALK again in a moment.';
      case 'client':
        return 'My speech ear tripped over itself — tap LIVE TALK to start it fresh, or type below.';
      case 'unavailable': case 'no-recognizer':
        return 'No speech service on this phone answered — typing works below, and I\'ll still answer.';
      case 'speech-timeout':
        return 'I only heard silence that time — tap LIVE TALK when you\'re ready, or type below.';
      default:
        return 'My speech ear hit a problem I don\'t have a name for (error ' + (code || '?') + ') — type below and I\'ll still answer.';
    }
  }

  /* ---------------- the call ----------------
     One session shape only: the live call. Tap LIVE TALK -> he
     speaks FIRST -> the ear opens -> continuous back-and-forth
     (barge-in included) until HANG UP or a spoken sign-off. */
  var GREETINGS = [
    'ALLON here — what do you need?',
    'ALLON, online — go ahead.',
    'Listening — what\'s the order?',
    'ALLON here, Mr. Moore — what do you need?',
    'At your service, sir — what\u2019s the order?'
  ];
  function pickBackend(){
    V.bridge = bridgeKind();
    if (V.bridge === 'full'){ V.backend = 'native'; return true; }
    if (V.srCtor){ V.backend = 'web'; return true; }
    V.backend = 'none';
    return false;
  }
  function voiceUnavailable(msg){
    haltListening();
    V.mode = 'off';
    liveBtn.textContent = '● LIVE TALK'; liveBtn.classList.remove('on');
    setState('unavailable', msg);
    log('voice unavailable: ' + msg);
  }
  /* Call-start briefing: a silent state query on the SAME command
     channel (never a user turn). The engine answers from real room +
     office state; the page speaks it between greeting and ear-open. */
  var briefingCb = null;
  function requestBriefing(cb){
    briefingCb = cb;
    lastReplySeen = '';
    topSet('__vpcMuseReply', '');
    topSet('__vpcMuseCmd', '__briefing__');
    setTimeout(function(){
      if (briefingCb){ var f = briefingCb; briefingCb = null; f(''); }
    }, 4000);
  }
  function startCall(){
    if (V.mode === 'live'){ return; }
    endSession(false);
    if (!pickBackend()){
      voiceUnavailable('Voice isn\'t available in this shell — no speech recognition here. ' +
        'Type below and I\'ll still answer and run your orders. (In the app, this needs the native speech bridge.)');
      return;
    }
    V.mode = 'live';
    liveBtn.classList.add('on');
    liveBtn.textContent = '■ HANG UP';
    log('call start: live via ' + V.backend);
    var g = GREETINGS[Math.floor(Math.random() * GREETINGS.length)];
    showReply(g);
    V.turns.push({ muse: g, greeting: true });
    /* ALLON speaks FIRST — then the floor is his. (If no voice-out
       backend exists, speak() itself schedules the hand-off.) */
    speak(g, function(){
      if (V.mode !== 'live') return;
      /* Canonical ALLON move: greeting first, then ONE breath of
         state-of-the-union from real state, then the ear opens. */
      requestBriefing(function(b){
        if (V.mode !== 'live') return;
        if (b && b.indexOf('FINISH THE TUTORIAL') !== 0 && b.toLowerCase().indexOf("didn't catch") !== 0){
          showReply(b);
          V.turns.push({ muse: b, briefing: true });
          speak(b, function(){
            if (V.mode === 'live'){ setState('listening', '<b>Listening…</b> just talk — or tap HANG UP'); ensureListening(); }
          });
        } else {
          setState('listening', '<b>Listening…</b> just talk — or tap HANG UP'); ensureListening();
        }
      });
    });
  }
  function endSession(signoff){
    var was = V.mode;
    haltListening();
    stopSpeaking('end');
    V.mode = 'off';
    liveBtn.textContent = '● LIVE TALK'; liveBtn.classList.remove('on');
    if (was !== 'off') log('call end');
    if (signoff && was !== 'off'){
      var bye = "Okay — I'll be here. Tap LIVE TALK when you need me.";
      showReply(bye);
      speak(bye, null);   /* speak() no-ops gracefully with no voice-out */
      setState('idle', 'Call ended. <b>Tap LIVE TALK</b> when you need me.');
    } else if (was !== 'off'){
      setState('idle', 'Call ended. <b>Tap LIVE TALK</b> when you need me.');
    }
  }
  liveBtn.onclick = function(){
    if (V.mode === 'live') endSession(false);   /* the button IS the hang-up while the call runs */
    else startCall();
  };
  presence.addEventListener('click', function(){
    if (V.state === 'speaking' && V.mode === 'live'){
      log('barge-in: portrait tap');
      stopSpeaking('tap');
      setState('listening', '<b>Listening…</b> just talk — or tap HANG UP');
      ensureListening();
    }
  });

  /* ---------------- typed line (the quiet fallback — same channel) ---------------- */
  function sendTyped(text){
    text = (text || '').trim();
    if (!text) return;
    cmd.value = '';
    if (V.mode !== 'off' && isEndPhrase(text)){ endSession(true); return; }
    onFinalTranscript(text, 'typed');
  }
  $('send').onclick = function(){ sendTyped(cmd.value); };
  cmd.addEventListener('keydown', function(e){ if (e.key === 'Enter') sendTyped(cmd.value); });

  /* ---------------- state + test seams ----------------
     The seams drive the SAME handlers the recognizer drives, so a
     harness session is the real pipeline minus the microphone. */
  window.__vpcMuseState = function(){
    return { reply: replyTx.textContent || '', heard: heardTx.textContent || '',
             mode: V.mode, state: V.state, backend: V.backend, turns: V.turns.length };
  };
  window.__vpcMuseTestStart = function(){ startCall(); };
  window.__vpcMuseTestSay = function(text){ onFinalTranscript(text, 'test'); };
  window.__vpcMuseTestInterim = function(text){ onInterim(text); };
  window.__vpcMuseTestEnd = function(){ endSession(false); };
  log('muse ready: srCtor=' + V.srCtor + ' tts=' + V.tts + ' bridge=' + V.bridge);
})();
</script>
</body>
</html>
