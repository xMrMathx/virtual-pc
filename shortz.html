<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shortz — on the Virtual PC</title>
<style>
  :root{--bg:#0b0b10;--panel:#14141c;--line:#262633;--ink:#f2f2f7;--mut:#9a9aad;
        --cyan:#00f0ff;--mag:#ff2e88;--gold:#ffb800}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;overflow:hidden}
  header{padding:10px 14px 8px;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line)}
  header .logo{font-weight:900;font-size:22px;letter-spacing:.5px}
  header .logo b{color:var(--mag)}
  header .sub{color:var(--mut);font-size:12px}
  /* the player — the ONLY picture on this screen */
  #playerWrap{position:relative;background:#000;aspect-ratio:16/9;max-height:46vh;flex:0 0 auto}
  #player{position:absolute;inset:0;width:100%;height:100%;border:0;display:none}
  #playerIdle{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;
              color:var(--mut);text-align:center;padding:12px}
  #playerIdle .big{font-size:19px;color:var(--ink);font-weight:700}
  #nowPlaying{padding:7px 14px;font-size:13px;color:var(--gold);border-bottom:1px solid var(--line);
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
  #nowPlaying:empty{display:none}
  /* search + sections */
  #tools{padding:10px 12px 6px;flex:0 0 auto}
  #q{width:100%;height:46px;border-radius:11px;border:1.5px solid var(--line);background:var(--panel);
     color:var(--ink);font-size:16px;padding:0 14px;outline:none}
  #q:focus{border-color:var(--cyan)}
  #chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);
        background:var(--panel);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
  .chip.on{border-color:var(--cyan);color:var(--cyan)}
  #count{padding:2px 14px 6px;color:var(--mut);font-size:12.5px;flex:0 0 auto}
  /* browse — plain text rows, no pictures anywhere */
  #list{position:relative;flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
  #spacer{position:relative;width:100%}
  .row{position:absolute;left:0;right:0;height:58px;padding:9px 14px;border-bottom:1px solid #1b1b26;cursor:pointer}
  .row:active{background:#1a1a26}
  .row .t{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .m{font-size:12.5px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #empty{padding:26px 16px;color:var(--mut);text-align:center;display:none}
  /* description card (card-first: a tap describes, the card plays) */
  #card{position:fixed;inset:0;z-index:10;display:none;align-items:flex-end;background:rgba(2,2,6,.55)}
  #card.open{display:flex}
  /* max-height must be vh, NOT %: the % resolved against #sheetWrap, whose
     height is content-sized (indefinite), so it was treated as none — the
     sheet grew to full content height, spilled above the viewport (title,
     Part 1 and the close X unreachable) and never became a scroll box. */
  #sheet{background:var(--panel);width:100%;max-height:82vh;overflow-y:auto;border-radius:18px 18px 0 0;
         border-top:2px solid var(--cyan);padding:18px 18px 24px}
  #sheet h2{font-size:20px;line-height:1.25;margin-right:44px}
  #sheet .meta{color:var(--gold);font-size:13.5px;margin:8px 0}
  #sheet .desc{color:#d7d7e2;font-size:15px;line-height:1.5}
  #playBtn{margin-top:18px;width:100%;height:56px;border:0;border-radius:13px;background:var(--mag);color:#fff;
           font-size:18px;font-weight:800;cursor:pointer}
  #parts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  #parts:empty{display:none}
  .part{height:40px;padding:0 13px;border-radius:10px;border:1.5px solid var(--line);background:#1c1c28;
        color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
  #cardX{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);
         background:#1c1c28;color:var(--ink);font-size:19px;cursor:pointer}
  #sheetWrap{position:relative;width:100%}
  #projBtn{margin-top:10px;width:100%;height:52px;border-radius:13px;background:#0e1626;color:#7ee7ff;
           border:1.5px solid rgba(0,240,255,.65);font-size:16.5px;font-weight:800;cursor:pointer}
  #fsBtn{position:absolute;right:10px;bottom:10px;width:52px;height:52px;border-radius:12px;z-index:5;
         background:rgba(5,10,18,.82);color:#fff;border:1.5px solid rgba(255,255,255,.45);
         font-size:24px;cursor:pointer;display:none;line-height:1}
  #fsBtn:active{background:rgba(0,60,80,.9)}
  /* stage mode (Projector Fit Law): on the projector this page is
     ONLY the picture — full-frame, whole video visible, no chrome */
  body.stage header, body.stage #tools, body.stage #count, body.stage #list,
  body.stage #nowPlaying, body.stage #card, body.stage #fsBtn{display:none !important}
  body.stage #playerWrap{flex:1 1 auto;max-height:none;aspect-ratio:auto;height:100%}
</style>
</head>
<body>
<header>
  <div class="logo">Shortz<b>VS</b></div>
  <div class="sub">on your Virtual PC — pick a title, it plays up top</div>
</header>

<div id="playerWrap">
  <div id="playerIdle">
    <div class="big">▶ The player</div>
    <div>Tap any title below → its card → Play.<br>It plays right here, on this screen.</div>
  </div>
  <iframe id="player" title="Shortz player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  <button id="fsBtn" title="Watch on the big screen (Screen 1)">&#x2922;</button>
</div>
<div id="nowPlaying"></div>

<div id="tools">
  <input id="q" type="search" placeholder="Search 75,770 titles…" autocomplete="off">
  <div id="chips"></div>
</div>
<div id="count">Loading your catalog…</div>

<div id="list"><div id="spacer"></div><div id="empty">Nothing matches that search.</div></div>

<div id="card">
  <div id="sheetWrap">
    <div id="sheet">
      <h2 id="cTitle"></h2>
      <div class="meta" id="cMeta"></div>
      <div class="desc" id="cDesc"></div>
      <div id="parts"></div>
      <button id="playBtn">▶ &nbsp;PLAY HERE</button>
      <button id="projBtn">&#127902; &nbsp;PLAY ON PROJECTOR</button>
    </div>
    <button id="cardX" aria-label="Close">✕</button>
  </div>
</div>

<script src="shortz-feed.js"></script>
<script>
(function(){
  var FEED = window.VPC_FEED || [];
  var ROW = 58;
  var list = document.getElementById('list'), spacer = document.getElementById('spacer'),
      empty = document.getElementById('empty'), count = document.getElementById('count'),
      q = document.getElementById('q'), chips = document.getElementById('chips');
  var view = FEED, genre = '', query = '', current = null;

  function fmt(n){ return n.toLocaleString('en-US'); }
  count.textContent = FEED.length ? fmt(FEED.length) + ' titles — real catalog, no pictures, just pick one'
                                  : 'Catalog did not load — check the connection and reopen this screen.';

  /* section chips from the real genre counts */
  var counts = {};
  FEED.forEach(function(r){ counts[r[1]] = (counts[r[1]]||0)+1; });
  var genres = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; }).slice(0, 16);
  function chip(label, val){
    var b = document.createElement('button'); b.className = 'chip' + (genre===val?' on':'');
    b.textContent = label; b.onclick = function(){ genre = val; refreshChips(); apply(); };
    chips.appendChild(b);
  }
  function refreshChips(){
    chips.innerHTML = ''; chip('All', '');
    genres.forEach(function(g){ chip(g, g); });
  }
  refreshChips();

  function apply(){
    var needle = query.trim().toLowerCase();
    view = FEED.filter(function(r){
      if (genre && r[1] !== genre) return false;
      if (needle && r[0].toLowerCase().indexOf(needle) < 0) return false;
      return true;
    });
    spacer.style.height = (view.length * ROW) + 'px';
    empty.style.display = view.length ? 'none' : 'block';
    count.textContent = fmt(view.length) + (genre || needle ? ' matching titles' : ' titles — real catalog, no pictures, just pick one');
    list.scrollTop = 0; render();
  }
  var qt = null;
  q.addEventListener('input', function(){ clearTimeout(qt); qt = setTimeout(function(){ query = q.value; apply(); }, 160); });

  /* virtualised rows — 75k titles stay smooth */
  function render(){
    var st = list.scrollTop, h = list.clientHeight;
    var a = Math.max(0, Math.floor(st / ROW) - 4), b = Math.min(view.length, Math.ceil((st + h) / ROW) + 4);
    spacer.innerHTML = '';
    for (var i = a; i < b; i++){
      (function(r, idx){
        var d = document.createElement('div'); d.className = 'row'; d.style.top = (idx * ROW) + 'px';
        var t = document.createElement('div'); t.className = 't'; t.textContent = r[0];
        var m = document.createElement('div'); m.className = 'm';
        m.textContent = [r[1], r[2]].filter(Boolean).join(' · ');
        d.appendChild(t); d.appendChild(m);
        d.onclick = function(){ openCard(r); };
        spacer.appendChild(d);
      })(view[i], i);
    }
  }
  list.addEventListener('scroll', function(){ requestAnimationFrame(render); });
  window.addEventListener('resize', render);
  render();

  /* card-first: description card, then play — into the player up top */
  var card = document.getElementById('card');
  function openCard(r){
    current = r;
    document.getElementById('cTitle').textContent = r[0];
    document.getElementById('cMeta').textContent = [r[1], r[2]].filter(Boolean).join(' · ');
    document.getElementById('cDesc').textContent = r[3] || 'No description on file for this title.';
    var parts = document.getElementById('parts'); parts.innerHTML = '';
    if (r[5] && r[5].length > 1){
      r[5].forEach(function(p, i){
        var b = document.createElement('button'); b.className = 'part';
        b.textContent = 'Part ' + p[0];
        b.onclick = function(){ play(p[1], r[0], ctxFor(r, i)); };
        parts.appendChild(b);
      });
    }
    card.classList.add('open');
    /* NAMED CASE #1 anchor (Great Sweep): the sheet can keep its scroll
       position across opens on engines that don't reset it when the
       card hides (his phone opened a 69-part card at Part 13). Every
       card opens anchored at the TOP by construction, not courtesy. */
    var sh = document.getElementById('sheet'); if (sh) sh.scrollTop = 0;
  }
  function closeCard(){ card.classList.remove('open');
    var sh2 = document.getElementById('sheet'); if (sh2) sh2.scrollTop = 0; }
  document.getElementById('cardX').onclick = closeCard;
  card.addEventListener('click', function(e){ if (e.target === card) closeCard(); });
  document.getElementById('playBtn').onclick = function(){ if (current) play(current[4], current[0], ctxFor(current, -1, current[4])); };

  var player = document.getElementById('player'), idle = document.getElementById('playerIdle'),
      now = document.getElementById('nowPlaying');
  /* PLAY AT ALL TIMES (his law, Fix 16): once he starts a title it
     keeps playing no matter where he looks in the PC. The engine
     never hides this page's frame; and if the embed itself pauses
     for a reason that is NOT his own tap (players auto-pause when
     they think they've left the screen), the guard puts it back —
     while this screen's state is "playing", a pause he didn't ask
     for doesn't stand. His own pause always does: tapping into the
     video touches this page / blurs this window, and the guard
     stands down around any touch. */
  var wantPlay = false, lastTouchAt = 0, curYtId = null;
  function touched(){ lastTouchAt = Date.now(); }
  document.addEventListener('pointerdown', touched, true);
  document.addEventListener('touchstart', touched, true);
  window.addEventListener('blur', touched, true);

  function ytIdOf(url){
    var m = /youtube(?:-nocookie)?\.com\/embed\/([\w-]{6,})/.exec(url || '');
    if (m) return m[1];
    m = /youtu\.be\/([\w-]{6,})/.exec(url || '');
    return m ? m[1] : null;
  }

  /* YouTube IFrame API, loaded lazily on the first YouTube title.
     If it can't load (offline / blocked), playback still works the
     plain way — the guard simply has no API to hold. */
  var ytApi = 'idle', ytPlayer = null;   // idle | loading | ready | failed
  var displaced = false, dispEmbedSrc = null;   // displacement stop (below)
  function ensureYtApi(){
    if (ytApi !== 'idle') return;
    if (window.YT && YT.Player){ ytApi = 'ready'; bindYt(); return; }
    ytApi = 'loading';
    var prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function(){
      if (prev) prev();
      ytApi = 'ready'; bindYt();
    };
    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = function(){ if (ytApi === 'loading') ytApi = 'failed'; };
    document.head.appendChild(s);
    setTimeout(function(){ if (ytApi === 'loading') ytApi = 'failed'; }, 6000);
  }
  function bindYt(){
    if (!curYtId || ytPlayer) return;
    try {
      ytPlayer = new YT.Player('player', { events: {
        'onReady': function(){ player = document.getElementById('player'); },
        'onStateChange': onYtState,
        'onError': onYtError
      }});
    } catch (e) { ytPlayer = null; }
  }
  function onYtState(e){
    if (!ytPlayer) return;
    if (e.data === 0){ if (wantPlay) advance('ended'); return; }   // ENDED → next episode (Defect 24)
    if (!wantPlay) return;
    if (e.data === 2 && !displaced && Date.now() - lastTouchAt > 1500){   // PAUSED, not his tap
      try { ytPlayer.playVideo(); } catch (err) {}
    }
  }
  function onYtError(e){
    lastYtError = (e && typeof e.data !== 'undefined') ? e.data : -1;
    advance('error');   // a refused/dead video skips forward, never strands him (D12 discipline)
  }
  setInterval(function(){
    if (!wantPlay || displaced || !ytPlayer || !curYtId) return;
    if (Date.now() - lastTouchAt <= 1500) return;
    try { if (ytPlayer.getPlayerState() === 2) ytPlayer.playVideo(); } catch (e) {}
  }, 1200);

  /* Read-only playback state for the PC's own status surface. */
  window.__vpcShortzState = function(){
    var st = { wantPlay: wantPlay, disp: displaced, ytId: curYtId, yt: null, t: null,
               series: ctx && ctx.rec ? ctx.rec[0] : null,
               part: ctx ? ctx.idx : null,
               parts: ctx && ctx.parts ? ctx.parts.length : null,
               partLabel: ctx && ctx.parts && ctx.idx >= 0 ? ctx.parts[ctx.idx][0] : null,
               nowText: now.textContent, lastError: lastYtError };
    if (ytPlayer && ytPlayer.getPlayerState){
      try { st.yt = ytPlayer.getPlayerState(); st.t = ytPlayer.getCurrentTime(); } catch (e) {}
    }
    return st;
  };

  /* stage mode arrives from the engine when this layer is hosted
     on the projector wall (and leaves with it) */
  window.addEventListener('message', function(e){
    if (e.data && e.data.vpc === 'stage') document.body.classList.toggle('stage', !!e.data.on);
    if (e.data && e.data.vpc === 'displaced'){
      if (e.data.on) stopForDisplace(); else restoreFromDisplace();
    }
  });

  /* ── DISPLACEMENT STOP (his ruling 2026-11-01 ~20:36 CST — the
     Shortz half): the top page's watcher posts {vpc:'displaced'}
     when this surface is taken OFF its screen. A YouTube part is
     PAUSED through the API, and the auto-resume watchdog above is
     gated on this flag — an ungated pause here lasts ~1.2s before
     the watchdog restarts the show, hidden (that fight WAS the
     "random videos playing in the background" report). A
     non-YouTube embed has no API to pause: it is UNLOADED and
     restored (autoplay stripped) when the surface returns. While
     displaced the series cannot advance. On return the flag clears
     and this surface's own laws resume the show he was watching. ── */
  function stopForDisplace(){
    if (displaced) return;
    displaced = true;
    if (ytPlayer && ytPlayer.pauseVideo){ try { ytPlayer.pauseVideo(); } catch (e) {} }
    if (!curYtId){
      var p = document.getElementById('player');
      var src = p ? (p.getAttribute('src') || '') : '';
      if (src && src !== 'about:blank'){ dispEmbedSrc = src; try { p.src = 'about:blank'; } catch (e) {} }
    }
  }
  function restoreFromDisplace(){
    displaced = false;
    if (dispEmbedSrc){
      var p = document.getElementById('player');
      if (p){ try { p.src = dispEmbedSrc.replace('autoplay=1', 'autoplay=0'); } catch (e) {} }
      dispEmbedSrc = null;
    }
  }

  /* Flagship projector flow (his exact spec): the card's second
     button starts the title HERE, then hands the player to the
     projector wall — the engine hears it via the top-page flag. */
  function setTopFlag(name){
    try { window.top[name] = 'shortz'; } catch (e) {}
  }
  document.getElementById('projBtn').onclick = function(){
    if (!current) return;
    play(current[4], current[0], ctxFor(current, -1, current[4]));
    setTopFlag('__vpcPlayProjector');
  };
  /* Feature 25: the fullscreen button NEVER takes the phone over —
     it promotes the playing title to Screen 1 (the engine moves this
     very player, position and all). On Screen 1 it zooms instead;
     while promoted it reads as an exit. Native element-fullscreen
     requests are intercepted into the same promotion. */
  var fsBtn = document.getElementById('fsBtn');
  function promoted(){
    try { return !!window.top.__vpcPromoted; } catch (e) { return false; }
  }
  fsBtn.onclick = function(){
    if (promoted()) setTopFlag('__vpcUnpromote'); else setTopFlag('__vpcPromote');
  };
  setInterval(function(){
    fsBtn.textContent = promoted() ? '\u2715' : '\u2922';
    fsBtn.title = promoted() ? 'Back to this screen' : 'Watch on the big screen (Screen 1)';
  }, 600);
  document.addEventListener('fullscreenchange', function(){
    if (document.fullscreenElement){
      try { document.exitFullscreen(); } catch (e) {}
      /* Defect 15: in stage mode this page IS the big picture (the
         projector wall). An embed raising a fullscreen event on its
         own — mobile players do this unprompted — is not the user
         asking to move the player, so it raises no promote flag. */
      if (!promoted() && !document.body.classList.contains('stage')) setTopFlag('__vpcPromote');
    }
  });

  /* ── Defect 24: play like OUR player — a series CONTINUES ──────
     The catalog feed gives every multi-part title its episode list
     (record[5]: [episodeNumber, url] in play order). The page now
     remembers WHAT is in the player and WHICH part it is (ctx), so
     when a part ends, the next one loads and plays on its own —
     the real Shortz VS app behavior — on any screen this page is
     swapped onto and on the projector wall (stage mode is the same
     document; the advance lives in the player itself). A part that
     refuses (embed error) is skipped forward to the next playable
     one. The LAST part ends clean: state off, a Finished line, the
     browse untouched — no dead black box, no phantom advance for
     movies and single videos. */
  var ctx = null, lastYtError = null, lastAdvanceAt = 0, lastPlayUrl = null;
  function ctxFor(rec, idx, url){
    var parts = (rec && rec[5] && rec[5].length > 1) ? rec[5] : null;
    var i = (typeof idx === 'number') ? idx : -1;
    if (parts && i < 0 && url){
      for (var k = 0; k < parts.length; k++){ if (parts[k][1] === url){ i = k; break; } }
    }
    return { rec: rec, parts: parts, idx: i, failed: {} };
  }
  function nowLabel(){
    if (ctx && ctx.parts && ctx.idx >= 0)
      return '\u25b6 Now playing: ' + ctx.rec[0] + ' \u2014 Part ' + ctx.parts[ctx.idx][0];
    return '\u25b6 Now playing: ' + (ctx && ctx.rec ? ctx.rec[0] : '');
  }
  function loadedYtId(){
    try {
      var d = ytPlayer && ytPlayer.getVideoData ? ytPlayer.getVideoData() : null;
      return d && d.video_id ? d.video_id : null;
    } catch (e) { return null; }
  }
  function endState(){
    wantPlay = false;
    if (ctx && ctx.rec) now.textContent = '\u25a0 Finished: ' + ctx.rec[0];
    try { localStorage.removeItem(PLAY_KEY); } catch (e) {}
  }
  function advance(reason, forced){
    if (displaced){ setTimeout(function(){ advance(reason, forced); }, 1500); return; }
    if (!ctx || !ctx.parts){ endState(); return; }
    /* a late event from the PREVIOUS part must not skip a beat:
       only the video actually loaded may move the series on, and
       advances settle one at a time (a chained event re-queues). */
    var mine = ctx.idx >= 0 ? ytIdOf(ctx.parts[ctx.idx][1]) : null;
    var loaded = loadedYtId();
    if (loaded && mine && loaded !== mine) return;
    if (!forced && Date.now() - lastAdvanceAt < 900){
      var r = reason;
      setTimeout(function(){ advance(r, true); }, 950);
      return;
    }
    lastAdvanceAt = Date.now();
    if (reason === 'error' && ctx.idx >= 0) ctx.failed[ctx.idx] = 1;
    var nxt = ctx.idx + 1;
    while (nxt < ctx.parts.length && ctx.failed[nxt]) nxt++;
    if (nxt >= ctx.parts.length){ endState(); return; }
    ctx.idx = nxt;
    play(ctx.parts[nxt][1], ctx.rec[0]);
  }

  function play(url, title, c){
    if (!url) return;
    if (c) ctx = c;
    wantPlay = true; lastTouchAt = Date.now();
    player = document.getElementById('player');
    curYtId = ytIdOf(url);
    lastPlayUrl = url;
    var viaApi = false;
    if (curYtId && ytPlayer && ytPlayer.loadVideoById){
      try { ytPlayer.loadVideoById(curYtId); viaApi = true; } catch (e) { viaApi = false; }
    }
    if (!viaApi){
      if (!curYtId) ytPlayer = null;   // a non-YouTube embed replaces the frame; the API binding dies with it
      var extra = 'autoplay=1&rel=0' + (curYtId ? '&enablejsapi=1&playsinline=1' : '');
      player.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + extra;
      if (curYtId){ if (ytApi === 'ready') bindYt(); else ensureYtApi(); }
    }
    player.style.display = 'block'; idle.style.display = 'none';
    document.getElementById('fsBtn').style.display = 'block';
    now.textContent = ctx ? nowLabel() : ('\u25b6 Now playing: ' + title);
    closeCard();
    window.scrollTo(0, 0);
    savePlay(0);
  }

  /* ── Room persistence (his law; defect filed 2026-11-01): this
     surface keeps its own playback state — the title in the player,
     which part, the position, playing or paused — so a restart
     returns the video he left, where he left it. The engine saves
     the room; the surfaces save themselves. ──────────────────── */
  var PLAY_KEY = 'vpc_shortz_play';
  function savePlay(freshT){
    try {
      if (!ctx || !ctx.rec || !lastPlayUrl){ localStorage.removeItem(PLAY_KEY); return; }
      var st = null, t = (typeof freshT === 'number') ? freshT : 0;
      if (typeof freshT !== 'number' && ytPlayer && ytPlayer.getPlayerState){
        try { st = ytPlayer.getPlayerState(); t = ytPlayer.getCurrentTime() || 0; } catch (e) {}
      } else if (ytPlayer && ytPlayer.getPlayerState){
        try { st = ytPlayer.getPlayerState(); } catch (e) {}
      }
      localStorage.setItem(PLAY_KEY, JSON.stringify({
        v: 1, title: ctx.rec[0], url: lastPlayUrl,
        idx: ctx.idx, t: t, want: wantPlay, paused: (st === 2)
      }));
    } catch (e) {}
  }
  function restorePlay(){
    var sv = null;
    try { sv = JSON.parse(localStorage.getItem(PLAY_KEY) || 'null'); } catch (e) {}
    if (!sv || !sv.title || !sv.url) return;
    var rec = null;
    for (var i = 0; i < FEED.length; i++){ if (FEED[i][0] === sv.title){ rec = FEED[i]; break; } }
    if (!rec) return;
    ctx = ctxFor(rec, (typeof sv.idx === 'number') ? sv.idx : -1, sv.url);
    lastPlayUrl = sv.url;
    curYtId = ytIdOf(sv.url);
    wantPlay = !!sv.want && !sv.paused;
    lastTouchAt = Date.now();
    var start = Math.max(0, Math.floor(sv.t || 0));
    var extra = 'autoplay=' + (wantPlay ? 1 : 0) + '&rel=0' + (start ? '&start=' + start : '')
              + (curYtId ? '&enablejsapi=1&playsinline=1' : '');
    player.src = sv.url + (sv.url.indexOf('?') >= 0 ? '&' : '?') + extra;
    if (curYtId) ensureYtApi();
    player.style.display = 'block'; idle.style.display = 'none';
    document.getElementById('fsBtn').style.display = 'block';
    now.textContent = nowLabel();
    if (!wantPlay && curYtId){
      /* cued, not playing: once the API binds, hold the position paused */
      var holdT = setInterval(function(){
        if (ytPlayer && ytPlayer.pauseVideo){
          try { ytPlayer.seekTo(start, true); ytPlayer.pauseVideo(); } catch (e) {}
          clearInterval(holdT);
        }
      }, 600);
      setTimeout(function(){ clearInterval(holdT); }, 8000);
    }
  }
  restorePlay();
  setInterval(function(){ if (ctx && wantPlay) savePlay(); }, 2000);

})();
</script>

</html>
